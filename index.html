<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Your Free Resource</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: #111418;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Modal Utama Putih */
  .modal {
    background-color: #ffffff;
    border-radius: 12px;
    padding: 45px 30px 35px;
    width: 90%;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    position: relative;
  }

  /* Logo 4 Kotak di Atas */
  .logo-icon {
    display: grid;
    grid-template-columns: 16px 16px;
    gap: 4px;
    justify-content: center;
    position: absolute;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
  }
  .logo-icon div {
    width: 16px;
    height: 16px;
    background-color: #e74c3c;
    border-radius: 2px;
  }
  .logo-icon .top-right {
    border-radius: 2px 8px 2px 2px; /* Memberikan aksen melengkung sedikit seperti gambar */
  }

  h1 {
    font-size: 22px;
    color: #2c3e50;
    font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: -0.3px;
  }

  /* Timer */
  .timer-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .t-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 52px;
  }
  .t-num {
    font-family: "Courier New", Courier, monospace;
    font-size: 26px;
    font-weight: 700;
    color: #d32f2f; /* Merah untuk angka */
    letter-spacing: 1px;
  }
  .t-lbl {
    font-size: 10px;
    color: #95a5a6;
    margin-top: 5px;
    letter-spacing: 0.5px;
  }
  .t-sep {
    font-size: 22px;
    font-weight: bold;
    color: #d32f2f;
    margin-top: -2px;
  }

  .expire-text {
    font-size: 13px;
    color: #7f8c8d;
    margin-bottom: 32px;
  }

  /* Tombol Bersebelahan (Horizontal) */
  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    width: 100%;
  }
  .btn {
    flex: 1;
    padding: 15px 10px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    border: none;
  }
  .btn:hover {
    transform: translateY(-2px);
    opacity: 0.9;
  }
  .btn-dark {
    background-color: #2c3e50; /* Gelap / Navy */
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
  }
  .btn-red {
    background-color: #e74c3c; /* Merah */
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
  }

  /* Footer Links */
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #7f8c8d;
  }
  .footer a {
    color: #7f8c8d;
    text-decoration: none;
    margin: 0 6px;
  }
  .footer a:hover {
    text-decoration: underline;
  }
  
  @media (max-width: 380px) {
    .btn-group {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

  <div class="modal">
    <div class="logo-icon">
      <div></div><div class="top-right"></div>
      <div></div><div></div>
    </div>
    
    <h1>Access Your Free Resource</h1>
    
    <div class="timer-wrap">
      <div class="t-box">
        <span class="t-num" id="tDays">02</span>
        <span class="t-lbl">DAYS</span>
      </div>
      <span class="t-sep">:</span>
      <div class="t-box">
        <span class="t-num" id="tHours">23</span>
        <span class="t-lbl">HOURS</span>
      </div>
      <span class="t-sep">:</span>
      <div class="t-box">
        <span class="t-num" id="tMins">58</span>
        <span class="t-lbl">MINUTES</span>
      </div>
      <span class="t-sep">:</span>
      <div class="t-box">
        <span class="t-num" id="tSecs">52</span>
        <span class="t-lbl">SECONDS</span>
      </div>
    </div>

    <div class="expire-text">Offer Expire Soon</div>

    <div class="btn-group">
      <a href="#" id="btnContinue" class="btn btn-dark">Continue &rarr;</a>
      <a href="#" id="btnClose" class="btn btn-red">Close</a>
    </div>
  </div>
  
  <div class="footer">
    <a href="#">Privacy policy</a> | <a href="#">Legal</a> | <a href="#">Terms and conditions</a>
  </div>

<script>
// ===== SMARTLINK ADSTERRA =====
const SMARTLINK = "https://www.profitableratecpmnetwork.com/i9dcw2vxjv?key=c88999d0de5123cccebdcce979b7e0de
";
// ==============================

// FUNGSI PAKSA REDIRECT UNTUK KEDUA TOMBOL
const btnContinue = document.getElementById('btnContinue');
const btnClose = document.getElementById('btnClose');

function forceRedirect(e) {
  e.preventDefault(); // Mengunci browser agar tidak kembali ke href="#"
  window.location.href = SMARTLINK; // Paksa masuk ke Smartlink
}

btnContinue.addEventListener('click', forceRedirect);
btnClose.addEventListener('click', forceRedirect);

// COUNTDOWN TIMER (2 Hari, 23 Jam, 58 Menit, 52 Detik)
let totalSeconds = (2 * 86400) + (23 * 3600) + (58 * 60) + 52;

function pad(n) {
  return String(n).padStart(2, '0');
}

function updateTimer() {
  if (totalSeconds > 0) totalSeconds--;
  
  let d = Math.floor(totalSeconds / 86400);
  let h = Math.floor((totalSeconds % 86400) / 3600);
  let m = Math.floor((totalSeconds % 3600) / 60);
  let s = totalSeconds % 60;
  
  document.getElementById('tDays').textContent = pad(d);
  document.getElementById('tHours').textContent = pad(h);
  document.getElementById('tMins').textContent = pad(m);
  document.getElementById('tSecs').textContent = pad(s);
}

updateTimer();
setInterval(updateTimer, 1000);
</script>
</body>
</html>
